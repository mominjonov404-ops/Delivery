plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.yetkazma.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yetkazma.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        // Supabase env vars injected at build time (GitHub Actions secrets)
        manifestPlaceholders += [
            supabaseUrl: System.getenv('SUPABASE_URL') ?: '',
            supabaseAnonKey: System.getenv('SUPABASE_ANON_KEY') ?: ''
        ]
    }

    signingConfigs {
        release {
            if (System.getenv('KEY_STORE_PATH')) {
                storeFile file(System.getenv('KEY_STORE_PATH'))
                storePassword System.getenv('KEY_STORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}
